<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>03 · Underline tabs — GitReverse design</title>
    <link rel="stylesheet" href="./shared.css" />
  </head>
  <body>
    <header class="nav">
      <a class="wordmark" href="./index.html">Git<span class="rev">Reverse</span></a>
      <div class="nav-links">
        <a href="#">Library</a>
        <a href="#">Premium</a>
      </div>
    </header>

    <main class="main">
      <a class="back" href="./index.html">← All variations</a>

      <div class="hero">
        <span class="badge">Var 03</span>
        <h1>Steal the idea.<br />Keep the build.</h1>
        <p id="sub">
          Turn a codebase into a prompt you can hand to any coding agent.
        </p>
      </div>

      <div class="tabs" role="tablist" aria-label="Reverse mode">
        <button type="button" id="mode-code" aria-pressed="true">
          Codebase
        </button>
        <button type="button" id="mode-web" aria-pressed="false">
          Website
        </button>
      </div>

      <div class="card-wrap">
        <div class="shadow"></div>
        <form class="card" onsubmit="return false">
          <div class="row">
            <div class="field">
              <div class="shadow"></div>
              <input
                id="input"
                type="text"
                autocomplete="off"
                placeholder="https://github.com/…"
              />
            </div>
            <div class="cta">
              <div class="shadow"></div>
              <button type="submit">Get Prompt</button>
            </div>
          </div>
          <div class="examples" id="examples"></div>
        </form>
      </div>

      <p class="cross" id="cross"></p>
    </main>

    <aside class="anno">
      <strong>Softer chrome</strong>
      Marketing headline stays; only subcopy + form swap with mode.
    </aside>

    <script>
      const REPOS = [
        { label: "Next.js", url: "https://github.com/vercel/next.js" },
        { label: "Openclaw", url: "https://github.com/openclaw/openclaw" },
        { label: "React", url: "https://github.com/facebook/react" },
        { label: "Supabase", url: "https://github.com/supabase/supabase" },
      ];
      const SITES = [
        { label: "YouTube", url: "https://youtube.com" },
        { label: "Pinterest", url: "https://pinterest.com" },
        { label: "Xbox", url: "https://xbox.com" },
        { label: "Apple", url: "https://apple.com" },
        { label: "Discord", url: "https://discord.com" },
      ];

      let mode = "code";
      const sub = document.getElementById("sub");
      const input = document.getElementById("input");
      const examples = document.getElementById("examples");
      const cross = document.getElementById("cross");
      const btnCode = document.getElementById("mode-code");
      const btnWeb = document.getElementById("mode-web");

      function render() {
        const isCode = mode === "code";
        btnCode.setAttribute("aria-pressed", String(isCode));
        btnWeb.setAttribute("aria-pressed", String(!isCode));

        sub.textContent = isCode
          ? "Turn a codebase into a prompt you can hand to any coding agent."
          : "Turn a website’s look and structure into a rebuildable design prompt.";
        input.placeholder = isCode ? "https://github.com/…" : "https://…";
        input.value = "";

        const list = isCode ? REPOS : SITES;
        examples.innerHTML =
          `<span class="label">${isCode ? "Try example repos:" : "Try example websites:"}</span>` +
          list
            .map(
              (ex) =>
                `<div class="chip"><div class="shadow"></div><button type="button" data-url="${ex.url}">${ex.label}</button></div>`
            )
            .join("");

        cross.innerHTML = isCode
          ? `Looking at a product site? <button type="button" class="linkish" data-switch="web">Try website reverse</button>`
          : `Looking at source code? <button type="button" class="linkish" data-switch="code">Try codebase reversing</button>`;
      }

      btnCode.addEventListener("click", () => {
        mode = "code";
        render();
      });
      btnWeb.addEventListener("click", () => {
        mode = "web";
        render();
      });
      examples.addEventListener("click", (e) => {
        const t = e.target.closest("button[data-url]");
        if (t) {
          input.value = t.dataset.url;
          input.focus();
        }
      });
      cross.addEventListener("click", (e) => {
        const t = e.target.closest("[data-switch]");
        if (t) {
          mode = t.dataset.switch;
          render();
        }
      });
      render();
    </script>
  </body>
</html>
